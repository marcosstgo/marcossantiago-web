name: Deploy a Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: { group: pages, cancel-in-progress: false }

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22.23.4', cache: npm }
      - run: npm ci
      - run: npm run build
      - name: Publicar
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx wrangler@4 pages deploy dist --project-name marcossantiago-web --branch main --commit-hash "$GITHUB_SHA"
      - name: Comprobar el sitio
        run: |
          sleep 15
          for p in / /portafolio/logos/ /logos-portfolio/brava.svg /servicios/; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "https://marcossantiago.com$p"); echo "$p $code"; [ "$code" = 200 ]
          done
          # Una ruta falsa debe dar 404 real, no la portada con 200.
          [ "$(curl -s -o /dev/null -w '%{http_code}' https://marcossantiago.com/no-existe-prueba/)" = 404 ]
          # El Modo Director vive: una idea vacía se rechaza con 400 (no gasta crédito).
          [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST -H 'Origin: https://marcossantiago.com' -H 'Content-Type: application/json' -d '{}' https://marcossantiago.com/api/director)" = 400 ]
